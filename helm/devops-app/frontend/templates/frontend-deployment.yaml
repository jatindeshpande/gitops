apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-app

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: frontend-app

  strategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: frontend-app

    spec:
      containers:
        - name: frontend-app

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.containerPort }}

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.containerPort }}

            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.containerPort }}

            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3